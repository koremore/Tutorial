<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כְשֶׁיָּבוֹא שָׁלוֹם</title>
  <style>
    /* Uniform dimensions from למנצח_שיר_מזמור.html */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "David", "David Libre", "Times New Roman", serif;
      background: #ffffff;
      color: #000000;
      direction: rtl;
      padding: 14.2pt 1in;
      word-wrap: break-word;
    }
    .page {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }
    .header {
      text-align: center;
      margin-bottom: 12pt;
    }
    h1.title {
      font-family: "David", "David Libre", "Times New Roman", serif;
      font-size: 26pt;
      font-weight: 700;
      line-height: 120%;
      text-align: center;
      margin: 3pt 0;
    }
    .credits {
      font-family: "David", "David Libre", "Times New Roman", serif;
      font-size: 14pt;
      font-weight: 400;
      line-height: normal;
      text-align: center;
      margin: 0 0 6pt 0;
    }
    .lyrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 1.5rem;
      row-gap: 1.75rem;
      justify-content: center;
      align-items: start;
      text-align: center;
    }
    .verse {
      text-align: center;
    }
    .verse p.lyric,
    .verse p.label {
      font-family: "David", "David Libre", "Times New Roman", serif;
      font-size: 18pt;
      font-weight: 400;
      line-height: 120%;
      margin: 0;
      text-align: center;
    }
    .verse p.label {
      font-weight: 700;
      margin-bottom: 2pt;
    }
    @media (max-width: 700px) {
      body { padding: 1rem; }
      .lyrics { grid-template-columns: 1fr; row-gap: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="title">כְשֶׁיָּבוֹא שָׁלוֹם</h1>
      <p class="credits">לַחַן: עֲמָמִי, מִלִּים: חַיִּים חֵפֶר</p>
    </header>
    <section class="lyrics" aria-label="מילות השיר">
      <div class="verse">
        <p class="lyric">אָז כֻּלָּנוּ נָשִׁיר</p>
        <p class="lyric">כָּאן בְּיַחַד</p>
        <p class="lyric">כְּשֶׁיָּבוֹא יָבוֹא שָׁלוֹם</p>
      </div>
      <div class="verse">
        <p class="lyric">וּכְשֶׁיָּבוֹא יָבוֹא שָׁלוֹם</p>
        <p class="lyric">וּכְשֶׁיָּבוֹא יָבוֹא שָׁלוֹם</p>
      </div>
    </section>
  </div>
</body>
</html>
